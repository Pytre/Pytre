name: Build executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.about.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Check tag against about.py
        id: about
        run: |
          python - <<'EOF'
          import os, sys
          from Pytre_Core.about import AppVersion, expected_git_tag

          tag = os.environ["GITHUB_REF_NAME"]
          if os.environ["GITHUB_REF_TYPE"] == "tag" and tag != expected_git_tag():
              print(f"::error::Tag {tag} does not match about.py, expected tag: {expected_git_tag()}")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"prerelease={'true' if AppVersion.current().is_prerelease else 'false'}\n")
          EOF

  test:
    name: Tests
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-build.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-build.lock

      - name: Install virtual display for Tkinter tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Run tests
        run: xvfb-run -a python -m pytest

  build:
    name: Build ${{ matrix.name }}
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pytre_Client
            spec: Pytre_Client.spec
          - name: Pytre_Server
            spec: Pytre_Server.spec
    defaults:
      run:
        shell: bash
    env:
      # MSI for stable releases only, as MSI versions can't tell pre-releases apart - a manual run builds one to test it
      BUILD_MSI: ${{ matrix.name == 'Pytre_Client' && (needs.version.outputs.prerelease == 'false' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.lock

      # Same single environment as the local build: PyInstaller only bundles what is actually imported
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-build.lock

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean ${{ matrix.spec }}

      - name: Smoke test server executable
        if: matrix.name == 'Pytre_Server'
        run: ./dist/Pytre_Server.exe --help

      # Tag "v.2.0.0-alpha" -> Pytre_Client_2.0.0-alpha.exe ; manual run on a branch -> Pytre_Client_dev.exe
      - name: Add version to executable name
        id: asset
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version#.}"
          version="${version//\//-}"
          mv "dist/${{ matrix.name }}.exe" "dist/${{ matrix.name }}_${version}.exe"
          echo "ASSET_VERSION=${version}" >> "$GITHUB_ENV"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Folder build, updated by the client itself or by a deployment - zipped with its Pytre_Client/ root folder
      - name: Build client folder and zip it
        if: matrix.name == 'Pytre_Client'
        run: |
          pyinstaller --noconfirm --workpath build/onedir ${{ matrix.spec }} -- --onedir
          test -f "dist/${{ matrix.name }}/${{ matrix.name }}.exe"
          compgen -G "dist/${{ matrix.name }}/_internal_*" > /dev/null
          python - <<'EOF'
          import os, shutil
          name, version = os.environ["NAME"], os.environ["ASSET_VERSION"]
          shutil.make_archive(f"dist/{name}_{version}", "zip", root_dir="dist", base_dir=name)
          EOF
        env:
          NAME: ${{ matrix.name }}

      - name: Build client installer
        if: env.BUILD_MSI == 'true'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool install --global wix --version 7.0.1
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $version, $manufacturer, $homepage = python -c "from Pytre_Core.about import AUTHOR, HOMEPAGE_LINK, AppVersion; print(AppVersion.current().base_version); print(AUTHOR); print(HOMEPAGE_LINK)"
          wix build Pytre_Client.wxs -arch x64 -acceptEula wix7 `
            -d "Version=$version" -d "Manufacturer=$manufacturer" -d "HomepageLink=$homepage" `
            -bindpath "Client=$PWD\dist\Pytre_Client" `
            -bindpath "Res=$PWD\Pytre_Core\res" `
            -bindpath "Templates=$PWD\templates" `
            -o "dist\Pytre_Client_$env:ASSET_VERSION.msi"

      # The runner is an administrator: install and uninstall for real
      - name: Test client installer
        if: env.BUILD_MSI == 'true'
        shell: pwsh
        run: |
          $msi = (Resolve-Path "dist\Pytre_Client_$env:ASSET_VERSION.msi").Path
          $exe = "$env:ProgramFiles\Pytre_Client\Pytre_Client.exe"
          $install = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v msi_install.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Install failed with exit code $($install.ExitCode)" }
          if (-not (Test-Path $exe)) { throw "$exe wasn't installed" }
          if (-not (Test-Path "$env:ProgramFiles\Pytre_Client\Pytre.policy.json")) { throw "Update policy wasn't installed" }
          $uninstall = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn /l*v msi_uninstall.log" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed with exit code $($uninstall.ExitCode)" }
          if (Test-Path $exe) { throw "$exe is still there after uninstall" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.name == 'Pytre_Client'
        with:
          name: msi-logs
          path: msi_*.log
          if-no-files-found: ignore

      # One artifact per file, named after it and downloadable as is (no archive around it)
      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/${{ matrix.name }}_${{ steps.asset.outputs.version }}.exe
          archive: false
          if-no-files-found: error

      - name: Upload client folder zip
        if: matrix.name == 'Pytre_Client'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/${{ matrix.name }}_${{ steps.asset.outputs.version }}.zip
          archive: false
          if-no-files-found: error

      - name: Upload client installer
        if: env.BUILD_MSI == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/${{ matrix.name }}_${{ steps.asset.outputs.version }}.msi
          archive: false
          if-no-files-found: error

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: |
            dist/${{ matrix.name }}_*.exe
            dist/${{ matrix.name }}_*.zip
            dist/${{ matrix.name }}_*.msi

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: "Pytre_*"
          merge-multiple: true
          skip-decompress: true  # the client zip is an artifact of its own: keep it as is

      # Artifacts uploaded without archive may land in a subfolder of their own: bring every file to dist/
      - name: Gather files
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          ls -l dist

      - name: Compute checksums
        run: |
          shopt -s nullglob
          cd dist && sha256sum *.exe *.zip *.msi > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/SHA256SUMS.txt
          archive: false
          if-no-files-found: error

  release-notes:
    name: Release notes
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS.txt
          skip-decompress: true

      # One line per kind of file listed in SHA256SUMS.txt: pre-releases have no MSI
      - name: Write release notes
        run: |
          test -f SHA256SUMS.txt
          built() { grep -Eq "[ *]$1\$" SHA256SUMS.txt; }  # file name regex
          describe() { if built "$1"; then echo "- \`$2\`: $3"; fi; }
          {
            echo "Windows builds, see README for details:"
            describe 'Pytre_Client_.*\.exe' "Pytre_Client_*.exe" "desktop client, portable single executable (pure client mode only)"
            describe 'Pytre_Client_.*\.zip' "Pytre_Client_*.zip" "the same client as a folder, which starts faster"
            describe 'Pytre_Client_.*\.msi' "Pytre_Client_*.msi" "the same folder as a Windows installer, which never updates itself"
            describe 'Pytre_Server_.*\.exe' "Pytre_Server_*.exe" "server, portable single executable (console application)"
            echo
            echo "The client executable and the zip update themselves, unless an enterprise policy turns updates off."
            if built '.*\.msi'; then echo "The MSI installs a policy file that disables updates."; fi
            echo
            echo "To verify a download: compare its hash with \`SHA256SUMS.txt\` (\`Get-FileHash <file>\` in PowerShell),"
            echo "or check its build provenance with \`gh attestation verify <file> --repo Pytre/Pytre\`."
          } > release_notes.md
          cat release_notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: release_notes.md
          archive: false
          if-no-files-found: error

  release:
    needs: [version, checksums, release-notes]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true  # the client zip is an artifact of its own: keep it as is

      # The files and SHA256SUMS.txt of the checksums job, gathered the same way
      - name: Gather files
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -empty -delete
          ls -l dist

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        id: release
        with:
          draft: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.msi
            dist/SHA256SUMS.txt
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body_path: dist/release_notes.md

      # Immutable releases lock assets on publication: they're attached to the draft above first
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
