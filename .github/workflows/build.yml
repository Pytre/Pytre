name: Build executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.about.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Check tag against about.py
        id: about
        run: |
          python - <<'EOF'
          import os, sys
          from Pytre_Core.about import AppVersion, expected_git_tag

          tag = os.environ["GITHUB_REF_NAME"]
          if os.environ["GITHUB_REF_TYPE"] == "tag" and tag != expected_git_tag():
              print(f"::error::Tag {tag} does not match about.py, expected tag: {expected_git_tag()}")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"prerelease={'true' if AppVersion.current().is_prerelease else 'false'}\n")
          EOF

  test:
    name: Tests
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-build.lock

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-build.lock

      - name: Install virtual display for Tkinter tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Run tests
        run: xvfb-run -a python -m pytest

  build:
    name: Build ${{ matrix.name }}
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pytre_Client
            spec: Pytre_Client.spec
          - name: Pytre_Server
            spec: Pytre_Server.spec
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.lock

      # Same single environment as the local build: PyInstaller only bundles what is actually imported
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-build.lock

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean ${{ matrix.spec }}

      - name: Smoke test server executable
        if: matrix.name == 'Pytre_Server'
        run: ./dist/Pytre_Server.exe --help

      # Tag "v.2.0.0-alpha" -> Pytre_Client_2.0.0-alpha.exe ; manual run on a branch -> Pytre_Client_dev.exe
      - name: Add version to executable name
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version#.}"
          version="${version//\//-}"
          mv "dist/${{ matrix.name }}.exe" "dist/${{ matrix.name }}_${version}.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}_*.exe
          if-no-files-found: error

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: dist/${{ matrix.name }}_*.exe

  release:
    needs: [version, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums
        run: cd dist && sha256sum *.exe > SHA256SUMS.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        id: release
        with:
          draft: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            Portable Windows executables, no installation needed: download and run.
            - `Pytre_Client_*.exe`: desktop client (pure client mode only, see README)
            - `Pytre_Server_*.exe`: server (console application)

            To verify a download: compare its hash with `SHA256SUMS.txt` (`Get-FileHash <file>` in PowerShell),
            or check its build provenance with `gh attestation verify <file> --repo Pytre/Pytre`.

      # Immutable releases lock assets on publication: they're attached to the draft above first
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
