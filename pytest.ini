[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    -n auto
    --cov=Pytre_Core
    --cov=Pytre_Server
    # --cov=Pytre_Client
    --cov-report=html
    --cov-report=term-missing
    # --cov-report=term:skip-covered
    --cov-fail-under=60
markers =
    security: Security tests to validate fixes
    regression: Regression tests
    unit: Unit tests
    integration: Integration tests
